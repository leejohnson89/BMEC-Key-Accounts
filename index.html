<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Key Accounts — Baldwin EMC</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#003A5D;--teal:#017381;--lteal:#53B6B2;
  --bg:#EFF3F5;--white:#fff;--border:#D4E1E7;
  --txt:#1A3445;--txt2:#2B4A5C;--mut:#6B8A96;--dim:#9BB0B8;
  --red:#C0392B;--rdim:rgba(192,57,43,0.07);--rdborder:rgba(192,57,43,0.25);
  --yellow:#D4A017;--ydim:rgba(212,160,23,0.08);--yborder:rgba(212,160,23,0.3);
  --green:#0E7C5B;--gdim:rgba(14,124,91,0.08);--gborder:rgba(14,124,91,0.3);
}
body,#root{background:var(--bg);color:var(--txt);font-family:'Raleway',sans-serif;font-size:13px}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--navy);padding:0 12px;height:44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo-title{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#fff}
.logo-org{font-size:8px;color:rgba(255,255,255,.45);letter-spacing:.09em;text-transform:uppercase}
.logo{display:flex;align-items:center;gap:8px}
.nav-wrap{background:var(--navy);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
.nav-wrap::-webkit-scrollbar{display:none}
.nb{background:transparent;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.5);padding:7px 9px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;transition:all .14s}
.nb:hover{color:#fff}
.nb.on{color:#fff;border-bottom-color:var(--lteal)}
.statsbar{background:var(--white);border-bottom:1px solid var(--border);display:flex;flex-shrink:0}
.stat{flex:1;padding:7px 5px;border-right:1px solid var(--border);cursor:pointer;text-align:center;transition:background .13s}
.stat:last-child{border-right:none}
.stat:hover{background:#f5f9fb}
.sv{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:17px;color:var(--navy);line-height:1}
.sv.red{color:var(--red)}.sv.teal{color:var(--teal)}.sv.yellow{color:var(--yellow)}.sv.green{color:var(--green)}
.sl{font-size:7px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;font-family:'Josefin Sans',sans-serif;font-weight:600}
#nav-stripe{height:3px;flex-shrink:0}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:11px;position:relative}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.view{display:none}.view.active{display:block}
.vh{margin-bottom:13px;padding-bottom:9px;border-bottom:2px solid var(--border);display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.vt{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:13px;color:var(--navy);letter-spacing:.05em;text-transform:uppercase}
.vs{font-size:10px;color:var(--mut);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px}
.card{background:var(--white);border:1.5px solid var(--border);border-radius:7px;overflow:hidden;cursor:pointer;transition:all .17s;box-shadow:0 1px 3px rgba(0,58,93,.05)}
.card:hover{border-color:#B0C8D4;box-shadow:0 3px 10px rgba(0,58,93,.09);transform:translateY(-1px)}
.ch{padding:10px 11px;display:flex;align-items:flex-start;gap:8px}
.cm{flex:1;min-width:0}
.tbadge{display:inline-flex;align-items:center;border-radius:3px;padding:2px 5px;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;border:1px solid transparent;font-family:'Josefin Sans',sans-serif;margin-right:3px}
.cname{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.ctit{font-size:10px;color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccity{font-size:10px;color:var(--mut)}
.uw{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.ul{font-size:8px;color:var(--mut);white-space:nowrap;text-align:center;line-height:1.3;font-family:'Josefin Sans',sans-serif;font-weight:700}
.ul.ov{color:var(--red)}
.pbar{height:2px;background:var(--bg)}
.pf{height:100%}
.moverlay{position:fixed;inset:0;background:rgba(0,20,40,.7);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.msheet{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhandle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
.mheader{padding:12px 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0;flex-wrap:wrap}
.mname{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:15px;color:var(--navy);min-width:0}
.mbadge{font-size:9px;font-weight:700;font-family:'Josefin Sans',sans-serif;padding:3px 8px;border-radius:12px;border:1.5px solid;white-space:nowrap}
.mclose{background:var(--bg);border:1.5px solid var(--border);color:var(--mut);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 20px}
.mbody::-webkit-scrollbar{width:3px}
.section{margin-bottom:16px}
.sec-title{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.clink{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:600;text-decoration:none;border:1.5px solid var(--border);color:var(--teal);background:var(--white);transition:all .13s}
.energy-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.energy-tile{background:var(--white);border:1.5px solid var(--border);border-radius:6px;padding:9px 11px}
.energy-label{font-size:8px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;font-family:'Josefin Sans',sans-serif;font-weight:700;margin-bottom:3px}
.energy-val{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:16px;color:var(--navy)}
.energy-val.empty{color:var(--dim);font-size:13px}
.energy-unit{font-size:9px;color:var(--mut);margin-left:2px}
.programs-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.prog-tile{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:5px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;transition:all .13s}
.prog-tile.active{background:rgba(14,124,91,0.07);border-color:var(--gborder)}
.prog-icon{font-size:16px;flex-shrink:0}
.prog-name{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:10px;color:var(--navy);flex:1}
.prog-status{font-size:8px;font-weight:700;font-family:'Josefin Sans',sans-serif;letter-spacing:.05em}
.prog-status.on{color:var(--green)}.prog-status.off{color:var(--dim)}
.int-log-form{background:var(--white);border:1.5px solid var(--border);border-radius:7px;padding:12px}
.fl{display:block;font-size:8px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;font-family:'Josefin Sans',sans-serif;font-weight:700}
.fi{background:var(--bg);border:1.5px solid var(--border);color:var(--txt);padding:7px 9px;border-radius:4px;font-family:'Raleway',sans-serif;font-size:12px;width:100%;outline:none;transition:border-color .13s;margin-bottom:9px}
.fi:focus{border-color:var(--teal)}
select.fi{cursor:pointer}
textarea.fi{resize:vertical;min-height:65px;margin-bottom:9px}
.int-submit{width:100%;background:var(--teal);border:none;color:#fff;padding:10px;border-radius:5px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .14s;display:flex;align-items:center;justify-content:center;gap:8px}
.int-submit:hover{opacity:.88}
.int-submit:disabled{background:var(--dim);cursor:not-allowed}
.hist-item{display:flex;gap:9px;padding:8px 10px;background:var(--white);border:1.5px solid var(--border);border-radius:5px;margin-bottom:4px}
.hist-meta{flex-shrink:0;min-width:65px}
.hist-date{font-size:9px;color:var(--mut);font-family:'Josefin Sans',sans-serif;font-weight:600}
.hist-badge{background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px;font-size:8px;color:var(--teal);display:inline-block;margin-top:3px;font-family:'Josefin Sans',sans-serif;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hist-badge.m{background:rgba(1,115,129,0.1);border-color:var(--teal)}
.hist-acct{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;color:var(--navy);margin-bottom:2px}
.hist-notes{font-size:11px;color:var(--txt2)}
.tl-section{margin-bottom:18px}
.tl-header{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:5px;margin-bottom:7px;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tl-header.green{background:var(--gdim);color:var(--green);border:1.5px solid var(--gborder)}
.tl-header.yellow{background:var(--ydim);color:var(--yellow);border:1.5px solid var(--yborder)}
.tl-header.red{background:var(--rdim);color:var(--red);border:1.5px solid var(--rdborder)}
.tl-cnt{font-size:17px;font-weight:700;margin-left:auto}
.int-row{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--white);border:1.5px solid var(--border);border-radius:5px;margin-bottom:3px;transition:all .14s;cursor:pointer}
.int-row:hover{border-color:#B0C8D4}
.int-row.green{border-left:3px solid var(--green)}
.int-row.yellow{border-left:3px solid var(--yellow)}
.int-row.red{border-left:3px solid var(--red)}
.int-name{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.int-sub{font-size:10px;color:var(--mut)}
.int-date{text-align:right;flex-shrink:0;min-width:75px}
.int-days{font-size:11px;font-weight:700;font-family:'Josefin Sans',sans-serif}
.int-lbl{font-size:9px;color:var(--dim);margin-top:1px}
.qsec{margin-bottom:18px}
.qsh{display:flex;align-items:center;gap:7px;margin-bottom:6px;padding-bottom:5px;border-bottom:2px solid var(--border)}
.qst{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.qcad{font-size:9px;color:var(--mut);font-family:'Josefin Sans',sans-serif}
.qrow{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--white);border:1.5px solid var(--border);border-radius:5px;margin-bottom:3px;cursor:pointer;transition:all .13s}
.qrow:hover{border-color:#B0C8D4}
.qrow.ov{border-color:var(--rdborder);background:#FFFBFB}
.qrank{width:19px;height:19px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mut);flex-shrink:0;font-family:'Josefin Sans',sans-serif;font-weight:700}
.qname{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtit{font-size:10px;color:var(--mut)}
.qstat{text-align:right;flex-shrink:0;min-width:78px}
.qurg{font-size:10px;font-weight:700;font-family:'Josefin Sans',sans-serif}
.qlast{font-size:9px;color:var(--dim);margin-top:1px}
.srow{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--white);border:1.5px solid var(--border);border-radius:4px;margin-bottom:3px}
.sname{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scity{font-size:9px;color:var(--mut)}
.tsel{background:var(--white);border:1.5px solid var(--border);padding:3px 6px;border-radius:3px;font-family:'Raleway',sans-serif;font-size:11px;cursor:pointer;min-width:155px;outline:none}
.srch{background:var(--white);border:1.5px solid var(--border);color:var(--txt);padding:5px 10px;border-radius:20px;font-family:'Raleway',sans-serif;font-size:11px;outline:none;width:100%;margin-bottom:10px}
.srch:focus{border-color:var(--teal)}
.srch::placeholder{color:var(--dim)}
.empty{text-align:center;padding:36px 14px}
.et{font-family:'Josefin Sans',sans-serif;font-size:14px;color:var(--mut);margin-bottom:5px;font-weight:600}
.ph-box{background:var(--white);border:2px dashed var(--border);border-radius:7px;padding:20px;text-align:center;margin-bottom:10px}
.sync-ok{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green);font-weight:600;margin-top:8px;font-family:'Josefin Sans',sans-serif}
.sync-err{font-size:11px;color:var(--red);margin-top:6px}

@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.refresh-btn{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.6);border-radius:4px;padding:3px 8px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:8px;letter-spacing:.08em;text-transform:uppercase;transition:all .13s}
.refresh-btn:hover{background:rgba(255,255,255,.1);color:#fff}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo">
      <svg width="24" height="20" viewBox="0 0 40 34" fill="none"><g transform="skewX(-12)"><rect x="0" y="14" width="9" height="20" rx="1" fill="#53B6B2"/><rect x="13" y="7" width="9" height="27" rx="1" fill="#80C8D4"/><rect x="26" y="0" width="9" height="34" rx="1" fill="white"/></g></svg>
      <div><div class="logo-title">Key Accounts</div><div class="logo-org">Baldwin EMC · External Affairs</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div id="sync-banner" style="display:none;align-items:center;gap:5px;font-size:9px;color:rgba(255,255,255,.7);font-family:'Josefin Sans',sans-serif;letter-spacing:.06em">
        <span style="display:inline-block;animation:spin 1s linear infinite;font-size:11px">&#x27F3;</span> SYNCING&hellip;
      </div>
      <div id="sync-done" style="font-size:9px;color:rgba(255,255,255,.4);font-style:italic">Live &middot; Monday.com</div>
      <button class="refresh-btn" onclick="manualRefresh()">&#x27F3; Refresh</button>
    </div>
  </div>
  <div class="nav-wrap">
    <button class="nb" data-view="revenue"      onclick="showView('revenue')">&#x1F4B0; Revenue</button>
    <button class="nb" data-view="political"    onclick="showView('political')">&#x1F3DB; Political</button>
    <button class="nb" data-view="load"         onclick="showView('load')">&#x26A1; Load</button>
    <button class="nb" data-view="interactions" onclick="showView('interactions')">&#x1F6A6; Interactions</button>
    <button class="nb" data-view="queue"        onclick="showView('queue')">Queue</button>
    <button class="nb" data-view="setup"        onclick="showView('setup')">Setup</button>
    <button class="nb" data-view="history"      onclick="showView('history')">History</button>
  </div>
  <div class="statsbar">
    <div class="stat" onclick="showView('revenue')"><div class="sv teal" id="stat-rev">&mdash;</div><div class="sl">Revenue</div></div>
    <div class="stat" onclick="showView('load')"><div class="sv" id="stat-load">&mdash;</div><div class="sl">Load</div></div>
    <div class="stat" onclick="showView('interactions')" style="background:rgba(14,124,91,0.04)"><div class="sv green" id="stat-green">&mdash;</div><div class="sl">&#x1F7E2; Active</div></div>
    <div class="stat" onclick="showView('interactions')" style="background:rgba(212,160,23,0.04)"><div class="sv yellow" id="stat-yellow">&mdash;</div><div class="sl">&#x1F7E1; Cooling</div></div>
    <div class="stat" onclick="showView('interactions')" style="background:rgba(192,57,43,0.04)"><div class="sv red" id="stat-red">&mdash;</div><div class="sl">&#x1F534; Cold</div></div>
  </div>
  <div id="nav-stripe" style="height:3px;flex-shrink:0"></div>
  <div class="main">
    <div id="view-revenue"      class="view"></div>
    <div id="view-political"    class="view"></div>
    <div id="view-load"         class="view"></div>
    <div id="view-interactions" class="view"></div>
    <div id="view-queue"        class="view"></div>
    <div id="view-setup"        class="view"></div>
    <div id="view-history"      class="view"></div>
  </div>
</div>
<div id="modal" class="moverlay">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mheader">
      <div style="flex:1;min-width:0">
        <div class="mname" id="modal-header-name"></div>
        <div style="font-size:10px;color:var(--mut);margin-top:2px" id="modal-header-city"></div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap" id="modal-header-badges"></div>
      <button class="mclose" onclick="closeModal()">&#x00D7;</button>
    </div>
    <div class="mbody" id="modal-body"></div>
  </div>
</div>

const today = ()=>new Date().toISOString().split('T')[0];
const daysSince = d=>d?Math.floor((Date.now()-new Date(d))/86400000):null;
const fmt = d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
const esc = s=>s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';

function getLastContact(id){
  return logs.filter(l=>l.accountId===id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0]?.date||null;
}
function getAccountLogs(id){
  return logs.filter(l=>l.accountId===id).sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function uInfo(acct){
  const tier=TIERS.find(t=>t.name===tierMap[acct.id]);
  if(!tier)return null;
  const last=getLastContact(acct.id);
  if(!last)return{pct:100,overdue:true,label:'Never contacted',tier};
  const days=daysSince(last);
  const pct=Math.min((days/tier.cadence)*100,100);
  const overdue=days>tier.cadence;
  const diff=Math.abs(days-tier.cadence);
  return{days,pct,overdue,label:overdue?`${diff}d overdue`:`${diff}d remaining`,tier};
}
function tlClass(acct){
  const last=getLastContact(acct.id);
  if(!last)return'red';
  const d=daysSince(last);
  return d<=60?'green':d<=180?'yellow':'red';
}
function mapsUrl(addr,city,zip){
  if(!addr||!city)return null;
  if(/^p\.?o\.?\s*box/i.test(addr.trim()))return null;
  if(/multiple/i.test(addr))return null;
  return`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${addr}, ${city} ${zip||''}`)}`;
}
function ring(pct,overdue,color){
  const r=13,c=2*Math.PI*r,dash=(pct/100)*c;
  const col=overdue?'#C0392B':(color||'#017381');
  const track=overdue?'rgba(192,57,43,0.1)':'rgba(0,58,93,0.07)';
  return`<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="${r}" fill="none" stroke="${track}" stroke-width="2.5"/><circle cx="17" cy="17" r="${r}" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="${dash.toFixed(2)} ${c.toFixed(2)}" stroke-linecap="round" transform="rotate(-90 17 17)"/></svg>`;
}

// ── MONDAY.COM SYNC ── fetch existing → prepend new entry → write back + create subitem ──
async function writeToMonday(itemId, date, type, notes, loggedBy){
  const byLine = loggedBy ? `Logged by: ${loggedBy}` : '';
  const newEntry = `[${type}] ${date}${byLine ? '\n'+byLine : ''}\n${notes}`;

  // Step 1: fetch current Interactions column value
  let existing = '';
  try {
    const fetchQ = `{boards(ids:[${BOARD_ID}]){items_page(limit:1,query_params:{rules:[{column_id:"id",compare_value:["${itemId}"]}]}){items{column_values(ids:["long_text_mm1jq6vw"]){... on LongTextValue{text}}}}}}`;
    const fr = await fetch('https://api.monday.com/v2',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':TOKEN,'API-Version':'2024-01'},
      body:JSON.stringify({query:fetchQ})
    });
    const fd = await fr.json();
    existing = fd?.data?.boards?.[0]?.items_page?.items?.[0]?.column_values?.[0]?.text || '';
  } catch(e){ /* proceed with empty existing */ }

  // Step 2: build combined log — new entry on top, separator, prior content
  const SEP = '\n─────────────────────────────\n';
  const combined = existing ? newEntry + SEP + existing : newEntry;

  // Step 3: write back to parent item Interactions column + update date
  const colVals = JSON.stringify({
    "date_mm0prnqq": {date},
    "long_text_mm1jq6vw": {text: combined}
  });
  const mutation = `mutation{change_multiple_column_values(board_id:${BOARD_ID},item_id:${itemId},column_values:${JSON.stringify(colVals)}){id}}`;
  const res = await fetch('https://api.monday.com/v2',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':TOKEN,'API-Version':'2024-01'},
    body:JSON.stringify({query:mutation})
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if(data.errors) throw new Error(data.errors[0]?.message||'API error');

  // Step 4: create a subitem under the account for this interaction
  // Subitem name = "[Type] · Date" for clean at-a-glance reading in Monday.com
  const subitemName = `[${type}] · ${date}`;
  const subColVals = JSON.stringify({
    "date0":           {date},
    "text_mm1tk7dr":   type,
    "text_mm1ts6eq":   loggedBy || 'Lee Johnson',
    "text_mm19x8n7":   notes,
    "color_mm1tw30k":  {"label": "Done"}
  });
  const subMutation = `mutation{create_subitem(parent_item_id:${itemId},item_name:${JSON.stringify(subitemName)},column_values:${JSON.stringify(subColVals)}){id}}`;
  await fetch('https://api.monday.com/v2',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':TOKEN,'API-Version':'2024-01'},
    body:JSON.stringify({query:subMutation})
  });

  return data;
}

  const bar=ui?.overdue?'#C0392B':(tier?.color||'#017381');

  const ringHtml=ui?`<div class="uw">${ring(pct,ui.overdue,tier?.color)}<div class="ul${ui.overdue?' ov':''}">${esc(ui.label)}</div></div>`:'';
  return`<div class="card" onclick="openModal('${acct.id}')">
    <div class="ch"><div class="cm">
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px">${tierHtml}${dsHtml}</div>

    <div class="pbar"><div class="pf" style="width:${pct}%;background:${bar}"></div></div>

}

function showView(v){
  currentView=v; currentSearch='';
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.querySelector(`.nb[data-view="${v}"]`)?.classList.add('on');
  const stripes={revenue:'#53B6B2',load:'#C9A153',political:'#003A5D',interactions:'linear-gradient(90deg,#0E7C5B,#D4A017 50%,#C0392B)',queue:'var(--lteal)',setup:'var(--border)',history:'var(--border)'};
  document.getElementById('nav-stripe').style.background=stripes[v]||'var(--lteal)';
  if(v==='revenue')renderRevenue();
  else if(v==='load')renderLoad();
  else if(v==='political')renderPolitical();
  else if(v==='interactions')renderInteractions();
  else if(v==='queue')renderQueue();

  else if(v==='history')renderHistory();
  renderStats();
}
function assignTier(id,val){

      </div>
      <div style="font-size:11px;color:var(--txt2);line-height:1.6">${esc(e.text)}</div>
    </div>`).join('')
    :`<div style="background:var(--bg);border:1.5px dashed var(--border);border-radius:6px;padding:14px;text-align:center"><div style="font-size:22px;margin-bottom:5px">📚</div><div style="font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12px;color:var(--mut);margin-bottom:4px">No historical intelligence yet</div><div style="font-size:10px;color:var(--dim);line-height:1.6">Work through this account with previous managers and team to capture institutional knowledge.</div></div>`;

    <div class="section"><div class="sec-title">Log Interaction</div>

          <div><label class="fl">Type</label><select id="log-type" class="fi" style="margin-bottom:0">${ITYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
        </div>
        <div style="margin-bottom:9px">
          <label class="fl">Logged By</label>
          <select id="log-by" class="fi" style="margin-bottom:0">
            <option value="Lee Johnson">Lee Johnson — VP External Affairs</option>
            <option value="Kevin Wilson">Kevin Wilson — Manager, Business Development & Metering</option>
          </select>
        </div>
        <label class="fl">Notes</label>
        <textarea id="log-notes" class="fi" placeholder="What was discussed, decided, or followed up on?"></textarea>
        <button class="int-submit" id="log-submit" onclick="saveInteraction('${acct.id}')">💾 Save & Sync to Monday.com</button>
        <div id="sync-result"></div>
      </div>
    </div>

    ${histLogHtml}

    <div class="section"><div class="sec-title">Energy Snapshot</div>
      <div class="energy-grid">${energyHtml}</div>
      ${chartHtml}
      <div style="text-align:right;margin-top:5px"><span style="font-size:10px;color:var(--teal);cursor:pointer;font-weight:600;font-family:'Josefin Sans',sans-serif" onclick="modalEditEnergy=!modalEditEnergy;renderModal()">${modalEditEnergy?'✓ Done editing':'✏ Edit data'}</span></div>
    </div>

    <div class="section"><div class="sec-title">Programs & Services</div><div class="programs-grid">${progsHtml}</div></div>

    <div class="section"><div class="sec-title">Sponsorship & Support</div>
      <div class="int-log-form" style="margin-bottom:10px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          <div><label class="fl">Year</label><input id="spon-year" class="fi" style="margin-bottom:0" placeholder="${new Date().getFullYear()}" type="number" min="2000" max="2035" value="${new Date().getFullYear()}"></div>
          <div><label class="fl">Category</label><select id="spon-cat" class="fi" style="margin-bottom:0">${sponCatOpts}</select></div>
        </div>
        <div style="margin-bottom:8px"><label class="fl">Amount (optional)</label><input id="spon-amount" class="fi" style="margin-bottom:0" placeholder="e.g. 500" type="text"></div>
        <label class="fl">Description</label>
        <textarea id="spon-desc" class="fi" style="min-height:65px" placeholder="Describe the sponsorship, event, or community support provided…"></textarea>
        <button class="int-submit" style="background:#1a7a3c" onclick="addSponsor('${acct.id}')">🤝 Add Sponsorship Record</button>

    <div class="section"><div class="sec-title">Historical Intelligence</div>
      <div class="int-log-form" style="margin-bottom:10px">

          <div><label class="fl">Your Name</label><input id="intel-author" class="fi" style="margin-bottom:0" placeholder="e.g. Lee Johnson"></div>
          <div><label class="fl">Category</label><select id="intel-cat" class="fi" style="margin-bottom:0">${catOpts}</select></div>
        </div>
        <label class="fl">Intelligence Entry</label>
        <textarea id="intel-text" class="fi" style="min-height:80px" placeholder="Past issues, expansions, ways we helped, key relationship context, rate history, political dynamics…"></textarea>
        <button class="int-submit" style="background:var(--navy)" onclick="addIntel('${acct.id}')">📚 Add to Historical Intelligence</button>
      </div>

  // Header badges
  const tierBadge=tier?`<div class="mbadge" style="color:${tier.color};border-color:${tier.color}40;background:${tier.dim}">T${tier.rank} · ${tier.short}</div>`:'';
  document.getElementById('modal-header-name').textContent=acct.name;
  document.getElementById('modal-header-city').textContent=acct.city||'';
  document.getElementById('modal-header-badges').innerHTML=`${tierBadge}<div class="mbadge" style="color:${tlCol};border-color:${tlCol}40;background:${tlc==='green'?'var(--gdim)':tlc==='yellow'?'var(--ydim)':'var(--rdim)'}">${tlLbl}</div>`;

async function saveInteraction(accountId){
  const notes=document.getElementById('log-notes')?.value?.trim();
  const date=document.getElementById('log-date')?.value||today();
  const type=document.getElementById('log-type')?.value||'Meeting';
  const loggedBy=document.getElementById('log-by')?.value||'Lee Johnson';
  if(!notes)return;
  const btn=document.getElementById('log-submit');
  const res=document.getElementById('sync-result');
  btn.disabled=true; btn.textContent='⏳ Syncing…';
  const acct=ACCOUNTS.find(a=>a.id===accountId);
  const newLog={id:Date.now().toString(),accountId,accountName:acct?.name||'',date,type,notes,loggedBy,fromMonday:false};
  logs=[newLog,...logs]; saveLogs();
  try{
    await writeToMonday(accountId,date,type,notes,loggedBy);
    res.innerHTML=`<div class="sync-ok">✓ Monday.com updated successfully</div>`;
  }catch(e){
    res.innerHTML=`<div class="sync-err">⚠ Saved locally. Monday.com sync failed: ${e.message}</div>`;
  }
  btn.disabled=false; btn.textContent='💾 Save & Sync to Monday.com';
  if(document.getElementById('log-notes')) document.getElementById('log-notes').value='';
  renderStats();
  if(currentView==='interactions')renderInteractions();
  if(currentView==='queue')renderQueue();
  if(currentView==='history')renderHistory();
  // Re-render just the history section inside the modal without full re-render
  const alogs=getAccountLogs(accountId);
  // full re-render modal to show new log in history
  renderModal();
}

function setEnergy(id,field,val){
  if(!energyData[id])energyData[id]={};
  energyData[id][field]=val;
  saveEnergy();
}
function setEnergyYear(id,year,val){
  if(!energyData[id])energyData[id]={};
  if(!energyData[id].y)energyData[id].y={};
  energyData[id].y[year]=Number(val)||0;
  saveEnergy();
}
function addSponsor(id){
  const desc=document.getElementById('spon-desc')?.value?.trim();
  const year=parseInt(document.getElementById('spon-year')?.value)||new Date().getFullYear();
  const cat=document.getElementById('spon-cat')?.value||'Other';
  const amount=document.getElementById('spon-amount')?.value?.trim();
  if(!desc)return;
  const entry={id:Date.now().toString(),year,category:cat,description:desc,amount:amount||''};
  if(!sponsorData[id])sponsorData[id]=[];
  sponsorData[id]=[entry,...sponsorData[id]];
  saveSponsor(); renderModal();
}
function deleteSponsor(acctId,entryId){
  if(!sponsorData[acctId])return;
  sponsorData[acctId]=sponsorData[acctId].filter(e=>e.id!==entryId);
  saveSponsor(); renderModal();
}
function toggleProg(id,progId){
  if(!progData[id])progData[id]={};
  progData[id][progId]=!progData[id][progId];
  saveProgs(); renderModal();
}
function addIntel(id){
  const text=document.getElementById('intel-text')?.value?.trim();
  const author=document.getElementById('intel-author')?.value?.trim();
  const cat=document.getElementById('intel-cat')?.value||'General';
  if(!text||!author)return;
  const entry={id:Date.now().toString(),date:today(),author,category:cat,text};
  if(!histIntel[id])histIntel[id]=[];
  histIntel[id]=[entry,...histIntel[id]];
  saveHist(); renderModal();
}
function deleteIntel(acctId,entryId){
  if(!histIntel[acctId])return;
  histIntel[acctId]=histIntel[acctId].filter(e=>e.id!==entryId);
  saveHist(); renderModal();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// ── LIVE SYNC ON LOAD ─────────────────────────────────────────────────────────
// NOTE: Sync only works when hosted (Netlify, web server, etc.)
// Opening as a local file:// blocks browser fetch to external APIs (CORS).
const IS_LOCAL = location.protocol === 'file:';

async function syncFromMonday() {
  if (IS_LOCAL) return; // file:// can't reach Monday.com API — skip silently

  const syncBanner = document.getElementById('sync-banner');
  const syncDone = document.getElementById('sync-done');
  if (syncBanner) syncBanner.style.display = 'flex';
  if (syncDone) syncDone.style.display = 'none';

  try {
    const query = `{
      boards(ids:[${BOARD_ID}]) {
        items_page(limit:100, query_params:{rules:[{column_id:"date_mm0prnqq",compare_value:[],operator:is_not_empty}]}) {
          items {
            id
            name
            column_values(ids:["date_mm0prnqq","long_text_mm1jq6vw"]) {
              id
              text
              ... on LongTextValue { text }
            }
          }
        }
      }
    }`;
    const res = await fetch('https://api.monday.com/v2', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':TOKEN,'API-Version':'2024-01'},
      body: JSON.stringify({query})
    });
    const data = await res.json();
    const items = data?.data?.boards?.[0]?.items_page?.items || [];
    const savedIds = new Set(logs.map(l => l.id));
    let added = 0;

    items.forEach(item => {
      const dateCol = item.column_values?.find(c => c.id === 'date_mm0prnqq');
      const notesCol = item.column_values?.find(c => c.id === 'long_text_mm1jq6vw');
      const date = dateCol?.text;
      const rawText = notesCol?.text || '';
      if (!date) return;

      const entryPattern = /\[([^\]]+)\]\s+(\d{4}-\d{2}-\d{2})\n((?:Logged by:[^\n]+\n)?)([\s\S]*?)(?=\n─|$)/g;
      let match;
      while ((match = entryPattern.exec(rawText)) !== null) {
        const [, type, entryDate, byLine, notes] = match;
        const loggedBy = byLine ? byLine.replace('Logged by:', '').trim() : '';
        const notesTrimmed = notes.trim();
        if (!notesTrimmed || notesTrimmed.startsWith('📋')) continue;
        const syntheticId = `mon-${item.id}-${entryDate}-${type.replace(/\s/g,'')}`;
        if (!savedIds.has(syntheticId)) {
          logs.push({ id:syntheticId, accountId:item.id, accountName:item.name,
            date:entryDate, type, notes:notesTrimmed, loggedBy, fromMonday:true });
          savedIds.add(syntheticId);
          added++;
        }
      }
    });

    if (added > 0) {
      logs.sort((a,b) => new Date(b.date) - new Date(a.date));
    }
    const now = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    if (syncDone) syncDone.textContent = `Live · synced ${now}`;
  } catch(e) {
    if (syncDone) syncDone.textContent = 'Monday.com · sync error';
  } finally {
    if (syncBanner) syncBanner.style.display = 'none';
    if (syncDone) syncDone.style.display = 'block';
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });

  // Show correct status based on context
  const syncDone = document.getElementById('sync-done');
  if (IS_LOCAL && syncDone) {
    syncDone.textContent = '⚠ Host on Netlify for live sync';
    syncDone.style.color = 'rgba(255,200,50,.7)';
  }

  document.getElementById('view-revenue').innerHTML =
    `<div style="text-align:center;padding:40px;color:var(--mut);font-family:'Josefin Sans',sans-serif;font-size:12px;letter-spacing:.08em">
      <div style="font-size:22px;margin-bottom:8px">${IS_LOCAL ? '📂' : '⟳'}</div>
      ${IS_LOCAL ? 'LOADING…' : 'SYNCING WITH MONDAY.COM…'}</div>`;
  document.getElementById('view-revenue').classList.add('active');

  if (!IS_LOCAL) await syncFromMonday();
  showView('revenue');
});

async function manualRefresh() {
  await syncFromMonday();
  showView(currentView);
  renderStats();
}
