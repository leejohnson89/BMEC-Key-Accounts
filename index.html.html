<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Key Accounts — Baldwin EMC</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#003A5D;--teal:#017381;--lteal:#53B6B2;
  --bg:#EFF3F5;--white:#fff;--border:#D4E1E7;--border2:#C0D3DC;
  --txt:#1A3445;--txt2:#2B4A5C;--mut:#6B8A96;--dim:#9BB0B8;
  --red:#C0392B;--rdim:rgba(192,57,43,0.07);--rdborder:rgba(192,57,43,0.22);
  --green:#0E7C5B;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Raleway',sans-serif;font-size:13px}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
/* TOPBAR */
.topbar{background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:46px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo{display:flex;align-items:center;gap:8px}
.logo-title{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#fff}
.logo-org{font-size:8px;color:rgba(255,255,255,.5);letter-spacing:.09em;text-transform:uppercase}
.topnav{display:flex;gap:1px}
.nb{background:transparent;border:none;color:rgba(255,255,255,.55);padding:5px 8px;border-radius:3px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .14s}
.nb:hover,.nb:active{color:#fff;background:rgba(255,255,255,.12)}
.nb.on{color:#fff;background:var(--teal)}
/* STATS */
.statsbar{background:var(--white);border-bottom:1px solid var(--border);display:flex;flex-shrink:0}
.stat{flex:1;padding:8px 6px;border-right:1px solid var(--border);cursor:pointer;text-align:center}
.stat:last-child{border-right:none}
.sv{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:18px;color:var(--navy);line-height:1}
.sv.red{color:var(--red)}
.sv.teal{color:var(--teal)}
.sl{font-size:7px;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;margin-top:2px;font-family:'Josefin Sans',sans-serif;font-weight:600}
.stripe{height:3px;background:linear-gradient(90deg,var(--navy),var(--teal) 55%,var(--lteal));flex-shrink:0}
/* MAIN */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
/* ONBOARD */
.onboard{background:var(--white);border:2px solid var(--lteal);border-radius:8px;padding:18px;margin-bottom:14px;text-align:center}
.onboard-title{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:14px;color:var(--navy);margin-bottom:6px}
.onboard-body{font-size:11px;color:var(--mut);margin-bottom:14px;line-height:1.6}
.onboard-btn{background:var(--navy);border:none;color:#fff;padding:9px 22px;border-radius:5px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
/* FILTERS */
.filters{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fb{background:var(--white);border:1.5px solid var(--border);color:var(--mut);padding:4px 10px;border-radius:20px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;transition:all .13s;display:inline-flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}
.srch{background:var(--white);border:1.5px solid var(--border);color:var(--txt);padding:4px 10px;border-radius:20px;font-family:'Raleway',sans-serif;font-size:11px;outline:none;width:120px;margin-left:auto}
.srch:focus{border-color:var(--teal)}
.srch::placeholder{color:var(--dim)}
/* ALERT */
.abanner{background:#FEF3F2;border:1.5px solid var(--rdborder);border-radius:5px;padding:8px 12px;margin-bottom:12px;font-size:11px;color:var(--red)}
/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
/* CARD */
.card{background:var(--white);border:1.5px solid var(--border);border-radius:7px;overflow:hidden;cursor:pointer;transition:all .17s;box-shadow:0 1px 3px rgba(0,58,93,.05)}
.ch{padding:11px 12px;display:flex;align-items:flex-start;gap:9px}
.cm{flex:1;min-width:0}
.tbadge{display:inline-flex;align-items:center;border-radius:3px;padding:2px 6px;font-size:8px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px;border:1px solid transparent;font-family:'Josefin Sans',sans-serif}
.cname{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.ctit{font-size:10px;color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccity{font-size:10px;color:var(--mut)}
.uw{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.ul{font-size:8px;color:var(--mut);white-space:nowrap;text-align:center;line-height:1.3;font-family:'Josefin Sans',sans-serif;font-weight:700}
.ul.ov{color:var(--red)}
.pbar{height:2px;background:var(--bg)}
.pf{height:100%}
.cbody{border-top:1px solid var(--border);padding:10px 12px;background:#FAFCFD}
.clinks{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.clink{color:var(--teal);font-size:10px;text-decoration:none;font-weight:500}
.lsl{font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;font-family:'Josefin Sans',sans-serif;font-weight:700}
.llist{margin-bottom:9px}
.lrow{display:flex;gap:7px;padding:3px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.lrow:last-child{border-bottom:none}
.ld{color:var(--dim);font-size:9px;flex-shrink:0;width:68px}
.lbadge{background:var(--bg);border:1px solid var(--border);padding:1px 4px;border-radius:2px;font-size:8px;color:var(--mut);flex-shrink:0;font-family:'Josefin Sans',sans-serif;font-weight:700}
.ln2{color:var(--txt2);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.logbtn{border:none;color:#fff;padding:7px;border-radius:4px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:10px;font-weight:700;width:100%;letter-spacing:.07em;text-transform:uppercase}
/* VIEW HEADER */
.vh{margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.vt{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:14px;color:var(--navy);letter-spacing:.05em;text-transform:uppercase}
.vs{font-size:10px;color:var(--mut);margin-top:2px}
/* QUEUE */
.qsec{margin-bottom:20px}
.qsh{display:flex;align-items:center;gap:7px;margin-bottom:7px;padding-bottom:5px;border-bottom:2px solid var(--border)}
.qst{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.qcad{font-size:9px;color:var(--mut);font-family:'Josefin Sans',sans-serif;font-weight:600}
.qrow{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--white);border:1.5px solid var(--border);border-radius:5px;margin-bottom:3px;box-shadow:0 1px 2px rgba(0,58,93,.04)}
.qrow.ov{border-color:var(--rdborder);background:#FFFBFB}
.qrank{width:20px;height:20px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mut);flex-shrink:0;font-family:'Josefin Sans',sans-serif;font-weight:700}
.qname{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtit{font-size:10px;color:var(--mut)}
.qstat{text-align:right;flex-shrink:0;min-width:80px}
.qurg{font-size:10px;font-weight:700;font-family:'Josefin Sans',sans-serif}
.qlast{font-size:9px;color:var(--dim);margin-top:1px}
.qlb{background:transparent;border:1.5px solid;padding:3px 8px;border-radius:3px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
/* SETUP */
.srow{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--white);border:1.5px solid var(--border);border-radius:4px;margin-bottom:3px}
.sname{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scity{font-size:9px;color:var(--mut)}
.tsel{background:var(--white);border:1.5px solid var(--border);padding:4px 6px;border-radius:3px;font-family:'Raleway',sans-serif;font-size:11px;cursor:pointer;min-width:160px;outline:none}
/* HISTORY */
.hrow{display:flex;gap:11px;padding:9px 12px;background:var(--white);border:1.5px solid var(--border);border-radius:5px;margin-bottom:4px}
.hm{flex-shrink:0;min-width:68px}
.hd{font-size:9px;color:var(--mut);font-family:'Josefin Sans',sans-serif;font-weight:700}
.hbadge{background:var(--bg);border:1px solid var(--border);padding:2px 5px;border-radius:3px;font-size:8px;color:var(--teal);display:inline-block;margin-top:3px;font-family:'Josefin Sans',sans-serif;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ha{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;color:var(--navy);margin-bottom:2px}
.hn{font-size:11px;color:var(--txt2)}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,25,45,.65);display:flex;align-items:center;justify-content:center;z-index:999}
.modal{background:var(--white);border:1.5px solid var(--border);border-radius:9px;padding:20px;width:320px;max-width:92vw;box-shadow:0 20px 55px rgba(0,58,93,.2)}
.mt{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:15px;color:var(--navy);margin-bottom:2px}
.ms{font-size:11px;color:var(--mut);margin-bottom:15px}
.fl{display:block;font-size:8px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;font-family:'Josefin Sans',sans-serif;font-weight:700}
.fi{background:var(--bg);border:1.5px solid var(--border);color:var(--txt);padding:7px 9px;border-radius:4px;font-family:'Raleway',sans-serif;font-size:12px;width:100%;outline:none;margin-bottom:10px}
.fi:focus{border-color:var(--teal)}
textarea.fi{resize:vertical;min-height:70px}
.macts{display:flex;gap:7px;margin-top:3px}
.mcancel{flex:1;background:var(--bg);border:1.5px solid var(--border);color:var(--mut);padding:8px;border-radius:4px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.msave{flex:2;background:var(--navy);border:none;color:#fff;padding:8px;border-radius:4px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
/* EMPTY */
.empty{text-align:center;padding:40px 16px}
.et{font-family:'Josefin Sans',sans-serif;font-size:14px;color:var(--mut);margin-bottom:5px;font-weight:600}
.es{font-size:10px;color:var(--dim)}
/* view display */
.view{display:none}
.view.active{display:block}
</style>
</head>

<div class="shell">
  <div class="topbar">
    <div class="logo">
      <svg width="26" height="22" viewBox="0 0 40 34" fill="none">

          <rect x="0" y="14" width="9" height="20" rx="1" fill="#53B6B2"/>
          <rect x="13" y="7" width="9" height="27" rx="1" fill="#80C8D4"/>
          <rect x="26" y="0" width="9" height="34" rx="1" fill="white"/>
        </g>
      </svg>
      <div>
        <div class="logo-title">Key Accounts</div>
        <div class="logo-org">Baldwin EMC · External Affairs</div>
      </div>
    </div>
    <div class="topnav">
      <button class="nb on" onclick="showView('dashboard')">Dashboard</button>
      <button class="nb" onclick="showView('queue')">Queue</button>
      <button class="nb" onclick="showView('setup')">Setup</button>
      <button class="nb" onclick="showView('history')">History</button>
    </div>
  </div>

  <div class="statsbar">
    <div class="stat" onclick="showView('dashboard')">
      <div class="sv" id="stat-total">85</div>
      <div class="sl">Accounts</div>
    </div>
    <div class="stat" onclick="showView('dashboard')">
      <div class="sv teal" id="stat-classified">0</div>
      <div class="sl">Classified</div>
    </div>
    <div class="stat" onclick="showView('queue')">
      <div class="sv teal" id="stat-overdue">0</div>
      <div class="sl">Overdue</div>
    </div>
    <div class="stat" onclick="showView('history')">
      <div class="sv teal" id="stat-interactions">0</div>
      <div class="sl">Logged</div>
    </div>
    <div class="stat" onclick="showView('setup')">
      <div class="sv red" id="stat-unassigned">85</div>
      <div class="sl">Unassigned</div>
    </div>
  </div>
  <div class="stripe"></div>

  <div class="main">
    <div id="view-dashboard" class="view active"></div>
    <div id="view-queue" class="view"></div>
    <div id="view-setup" class="view"></div>
    <div id="view-history" class="view"></div>
  </div>
</div>

<!-- LOG MODAL -->
<div class="overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="mt">Log Interaction</div>
    <div class="ms" id="modal-acct-name"></div>
    <label class="fl">Date</label>
    <input type="date" class="fi" id="log-date">
    <label class="fl">Interaction Type</label>
    <select class="fi" id="log-type">
      <option>Meeting</option><option>Phone Call</option><option>Email</option>
      <option>Site Visit</option><option>Event</option><option>Other</option>
    </select>
    <label class="fl">Notes</label>
    <textarea class="fi" id="log-notes" placeholder="What was discussed or accomplished?"></textarea>
    <div class="macts">
      <button class="mcancel" onclick="closeModal()">Cancel</button>
      <button class="msave" onclick="saveLog()">Save</button>
    </div>
  </div>
</div>

const TIERS = [
  {name:"Political / Government",rank:1,color:"#003A5D",dim:"rgba(0,58,93,0.09)",cadence:180,short:"POL"},
  {name:"Large Revenue",rank:2,color:"#017381",dim:"rgba(1,115,129,0.09)",cadence:180,short:"REV"},
  {name:"Large Load",rank:3,color:"#53B6B2",dim:"rgba(83,182,178,0.12)",cadence:270,short:"LOD"},
  {name:"Strategic Partner",rank:4,color:"#2E7D9A",dim:"rgba(46,125,154,0.09)",cadence:365,short:"STR"},
  {name:"Community Anchor",rank:5,color:"#6B9EAC",dim:"rgba(107,158,172,0.1)",cadence:365,short:"COM"},
];

let tierMap = {};
let logs = [];
let activeTier = "all";
let search = "";
let expanded = null;
let logModal = null;
let currentView = "dashboard";

try { tierMap = JSON.parse(localStorage.getItem("ka_tiers") || "{}"); } catch(e) {}
try { logs = JSON.parse(localStorage.getItem("ka_logs") || "[]"); } catch(e) {}

function save() {
  try { localStorage.setItem("ka_tiers", JSON.stringify(tierMap)); } catch(e) {}
  try { localStorage.setItem("ka_logs", JSON.stringify(logs)); } catch(e) {}
}

function today() { return new Date().toISOString().split("T")[0]; }

function daysSince(d) {
  if (!d) return null;
  return Math.floor((Date.now() - new Date(d)) / 86400000);
}

function getLastContact(id) {
  const found = logs.filter(l => l.accountId === id).sort((a,b) => new Date(b.date) - new Date(a.date));
  return found.length ? found[0].date : null;
}

function getAccountLogs(id) {
  return logs.filter(l => l.accountId === id).sort((a,b) => new Date(b.date) - new Date(a.date));
}

function urgencyInfo(acct) {
  const tier = TIERS.find(t => t.name === tierMap[acct.id]);
  if (!tier) return null;
  const last = getLastContact(acct.id);
  if (!last) return {pct:100, overdue:true, label:"Never contacted", tier:tier};
  const days = daysSince(last);
  const pct = Math.min((days / tier.cadence) * 100, 100);
  const overdue = days > tier.cadence;
  const diff = Math.abs(days - tier.cadence);
  return {days:days, pct:pct, overdue:overdue, label: overdue ? diff+"d overdue" : diff+"d remaining", tier:tier};
}

function ring(pct, overdue, color) {
  const r = 13, c = 2 * Math.PI * r, dash = (pct/100) * c;
  const col = overdue ? "#C0392B" : (color || "#017381");
  const track = overdue ? "rgba(192,57,43,0.1)" : "rgba(0,58,93,0.07)";
  return '<svg width="34" height="34" viewBox="0 0 34 34">' +
    '<circle cx="17" cy="17" r="' + r + '" fill="none" stroke="' + track + '" stroke-width="2.5"/>' +
    '<circle cx="17" cy="17" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="2.5"' +
    ' stroke-dasharray="' + dash.toFixed(2) + ' ' + c.toFixed(2) + '"' +
    ' stroke-linecap="round" transform="rotate(-90 17 17)"/></svg>';
}

function getSorted() {
  return ACCOUNTS.filter(a => {
    if (!tierMap[a.id]) return false;
    if (activeTier !== "all" && tierMap[a.id] !== activeTier) return false;
    if (search) {
      const q = search.toLowerCase();
      return a.name.toLowerCase().includes(q) || (a.city||"").toLowerCase().includes(q) || (a.contactTitle||"").toLowerCase().includes(q);
    }
    return true;
  }).sort((a,b) => {
    const ra = TIERS.find(t => t.name === tierMap[a.id]);
    const rb = TIERS.find(t => t.name === tierMap[b.id]);
    const rna = ra ? ra.rank : 99, rnb = rb ? rb.rank : 99;
    if (rna !== rnb) return rna - rnb;
    const ua = urgencyInfo(a), ub = urgencyInfo(b);
    return (ub ? ub.pct : 0) - (ua ? ua.pct : 0);
  });
}

function getClassified() { return ACCOUNTS.filter(a => tierMap[a.id]); }

function updateStats() {
  const classified = getClassified();
  const overdue = classified.filter(a => { const u = urgencyInfo(a); return u && u.overdue; }).length;
  const unassigned = ACCOUNTS.length - classified.length;
  document.getElementById("stat-total").textContent = ACCOUNTS.length;
  document.getElementById("stat-classified").textContent = classified.length;
  const oel = document.getElementById("stat-overdue");
  oel.textContent = overdue;
  oel.className = "sv " + (overdue > 0 ? "red" : "teal");
  document.getElementById("stat-interactions").textContent = logs.length;
  const uel = document.getElementById("stat-unassigned");
  uel.textContent = unassigned;
  uel.className = "sv " + (unassigned > 0 ? "red" : "teal");
}

function showView(name) {
  currentView = name;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");
  document.querySelectorAll(".nb").forEach(b => b.classList.remove("on"));
  document.querySelectorAll(".nb").forEach(b => {
    if (b.getAttribute("onclick") && b.getAttribute("onclick").includes(name)) b.classList.add("on");
  });
  renderView(name);
}

function renderView(name) {
  if (name === "dashboard") renderDashboard();
  else if (name === "queue") renderQueue();
  else if (name === "setup") renderSetup();
  else if (name === "history") renderHistory();
  updateStats();
}

function renderDashboard() {
  const el = document.getElementById("view-dashboard");
  const classified = getClassified();
  const sorted = getSorted();
  const allOD = classified.filter(a => { const u = urgencyInfo(a); return u && u.overdue; });

  if (classified.length === 0) {
    el.innerHTML = '<div class="onboard">' +
      '<div class="onboard-title">Welcome — Start in Setup</div>' +
      '<div class="onboard-body">All 85 accounts are loaded. Go to <strong>Setup</strong> and assign each account to a tier (Political, Revenue, Load, Strategic, or Community). Once classified, they appear here ranked by priority and contact urgency.</div>' +
      '<button class="onboard-btn" onclick="showView(\'setup\')">Go to Setup →</button>' +
      '</div>';
    return;
  }

  let html = "";

  if (allOD.length > 0 && activeTier === "all" && !search) {
    html += '<div class="abanner">⚠ <strong>' + allOD.length + ' account' + (allOD.length > 1 ? "s" : "") + '</strong> past contact cadence — see Queue tab</div>';
  }

  html += '<div class="filters">';
  const allStyle = activeTier === "all" ? ' style="border-color:#017381;color:#017381;background:rgba(1,115,129,0.07);font-weight:700"' : '';
  html += '<button class="fb"' + allStyle + ' onclick="setActiveTier(\'all\')">All (' + classified.length + ')</button>';
  TIERS.forEach(t => {
    const cnt = ACCOUNTS.filter(a => tierMap[a.id] === t.name).length;
    const act = activeTier === t.name;
    const st = act ? ' style="border-color:' + t.color + ';color:' + t.color + ';background:' + t.dim + ';font-weight:700"' : '';
    html += '<button class="fb"' + st + ' onclick="setActiveTier(\'' + t.name + '\')">' +
      '<span class="dot" style="background:' + t.color + '"></span>' + t.short + ' (' + cnt + ')</button>';
  });
  html += '<input class="srch" placeholder="Search…" value="' + (search||"") + '" oninput="setSearch(this.value)">';
  html += '</div>';

  if (sorted.length === 0) {
    html += '<div class="empty"><div class="et">' + (search ? "No matches" : "No accounts in this tier") + '</div></div>';
  } else {
    html += '<div class="grid">';
    sorted.forEach(acct => {
      const tier = TIERS.find(t => t.name === tierMap[acct.id]);
      const ui = urgencyInfo(acct);
      const isExp = expanded === acct.id;
      const pct = ui ? ui.pct : 0;
      const bar = ui && ui.overdue ? "#C0392B" : (tier ? tier.color : "#017381");
      const alogs = getAccountLogs(acct.id);
      const borderStyle = isExp ? 'border-color:' + (tier ? tier.color : "#017381") + ';box-shadow:0 3px 12px rgba(0,58,93,0.12)' : '';

      html += '<div class="card" style="' + borderStyle + '" onclick="toggleExpand(\'' + acct.id + '\')">';
      html += '<div class="ch"><div class="cm">';
      html += '<div class="tbadge" style="background:' + (tier ? tier.dim : "rgba(0,58,93,0.06)") + ';color:' + (tier ? tier.color : "#003A5D") + ';border-color:' + (tier ? tier.color : "#003A5D") + '28">T' + (tier ? tier.rank : "?") + ' · ' + (tier ? tier.short : "—") + '</div>';
      html += '<div class="cname">' + esc(acct.name) + '</div>';
      if (acct.contactTitle) html += '<div class="ctit">' + esc(acct.contactTitle) + '</div>';
      if (acct.city) html += '<div class="ccity">' + esc(acct.city) + '</div>';
      html += '</div>';
      if (ui) {
        html += '<div class="uw">' + ring(pct, ui.overdue, tier ? tier.color : "#017381") +
          '<div class="ul' + (ui.overdue ? " ov" : "") + '">' + ui.label + '</div></div>';
      }
      html += '</div>';
      html += '<div class="pbar"><div class="pf" style="width:' + pct + '%;background:' + bar + '"></div></div>';

      if (isExp) {
        html += '<div class="cbody" onclick="event.stopPropagation()">';
        if (acct.phone || acct.email) {
          html += '<div class="clinks">';
          if (acct.phone) html += '<a href="tel:' + acct.phone + '" class="clink">📞 ' + esc(acct.phone) + '</a>';
          if (acct.email) html += '<a href="mailto:' + acct.email + '" class="clink">✉ ' + esc(acct.email) + '</a>';
          html += '</div>';
        }
        if (alogs.length > 0) {
          html += '<div class="llist"><div class="lsl">Recent Interactions</div>';
          alogs.slice(0,3).forEach(l => {
            html += '<div class="lrow"><span class="ld">' + l.date + '</span><span class="lbadge">' + esc(l.type) + '</span><span class="ln2">' + esc(l.notes) + '</span></div>';
          });
          html += '</div>';
        }
        html += '<button class="logbtn" style="background:' + (tier ? tier.color : "#017381") + '" onclick="openLog(\'' + acct.id + '\')">+ Log Interaction</button>';
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }

  el.innerHTML = html;
}

function renderQueue() {
  const el = document.getElementById("view-queue");
  const classified = getClassified();

  if (classified.length === 0) {
    el.innerHTML = '<div class="vh"><div class="vt">Contact Queue</div></div>' +
      '<div class="onboard"><div class="onboard-title">No accounts classified yet</div>' +
      '<div class="onboard-body">Assign tiers in Setup, then your prioritized contact list appears here.</div>' +
      '<button class="onboard-btn" onclick="showView(\'setup\')">Go to Setup →</button></div>';
    return;
  }

  const allSorted = classified.sort((a,b) => {
    const ra = TIERS.find(t => t.name === tierMap[a.id]);
    const rb = TIERS.find(t => t.name === tierMap[b.id]);
    const rna = ra ? ra.rank : 99, rnb = rb ? rb.rank : 99;
    if (rna !== rnb) return rna - rnb;
    const ua = urgencyInfo(a), ub = urgencyInfo(b);
    return (ub ? ub.pct : 0) - (ua ? ua.pct : 0);
  });

  let html = '<div class="vh"><div class="vt">Contact Queue</div><div class="vs">Ordered by urgency within tier — work top to bottom</div></div>';

  TIERS.forEach(tier => {
    const accts = allSorted.filter(a => tierMap[a.id] === tier.name);
    if (!accts.length) return;

    html += '<div class="qsec">';
    html += '<div class="qsh"><span class="dot" style="background:' + tier.color + ';width:7px;height:7px"></span>';
    html += '<span class="qst" style="color:' + tier.color + '">' + tier.name + '</span>';
    html += '<span class="qcad">· every ' + tier.cadence + ' days</span></div>';

    accts.forEach((acct, i) => {
      const ui = urgencyInfo(acct);
      const last = getLastContact(acct.id);
      html += '<div class="qrow' + (ui && ui.overdue ? " ov" : "") + '">';
      html += '<div class="qrank">' + (i+1) + '</div>';
      html += '<div style="flex:1;min-width:0"><div class="qname">' + esc(acct.name) + '</div>';
      if (acct.contactTitle) html += '<div class="qtit">' + esc(acct.contactTitle) + '</div>';
      html += '</div>';
      html += '<div class="qstat"><div class="qurg" style="color:' + (ui && ui.overdue ? "#C0392B" : tier.color) + '">' + (ui ? ui.label : "Never contacted") + '</div>';
      if (last) html += '<div class="qlast">Last: ' + last + '</div>';
      html += '</div>';
      html += '<button class="qlb" style="border-color:' + tier.color + ';color:' + tier.color + '" onclick="openLog(\'' + acct.id + '\')">Log</button>';
      html += '</div>';
    });
    html += '</div>';
  });

  el.innerHTML = html;
}

function renderSetup() {
  const el = document.getElementById("view-setup");
  const unassigned = ACCOUNTS.length - getClassified().length;

  let html = '<div class="vh"><div class="vt">Account Classification</div><div class="vs">Assign each account to a tier — saves automatically. ';
  if (unassigned > 0) {
    html += '<span style="color:#C0392B;font-weight:700">· ' + unassigned + ' unassigned</span>';
  } else {
    html += '<span style="color:#0E7C5B;font-weight:700">· All classified ✓</span>';
  }
  html += '</div></div>';

  ACCOUNTS.forEach(acct => {
    const cur = tierMap[acct.id] || "";
    const tier = TIERS.find(t => t.name === cur);
    const col = tier ? tier.color : "#6B8A96";

    html += '<div class="srow">';
    html += '<div style="flex:1;min-width:0"><div class="sname">' + esc(acct.name) + '</div>';
    if (acct.city) html += '<div class="scity">' + esc(acct.city) + '</div>';
    html += '</div>';
    html += '<select class="tsel" style="color:' + col + ';font-weight:' + (tier ? "600" : "400") + '" onchange="assignTier(\'' + acct.id + '\',this.value)">';
    html += '<option value=""' + (!cur ? " selected" : "") + '>— Unassigned —</option>';
    TIERS.forEach(t => {
      html += '<option value="' + t.name + '"' + (cur === t.name ? " selected" : "") + '>' + t.short + ' · ' + t.name + '</option>';
    });
    html += '</select></div>';
  });

  el.innerHTML = html;
}

function renderHistory() {
  const el = document.getElementById("view-history");
  let html = '<div class="vh"><div class="vt">Interaction History</div><div class="vs">' + logs.length + ' interactions logged</div></div>';

  if (logs.length === 0) {
    html += '<div class="empty"><div class="et">No interactions yet</div><div class="es">Log from Dashboard or Queue</div></div>';
  } else {
    logs.forEach(log => {
      html += '<div class="hrow">';
      html += '<div class="hm"><div class="hd">' + log.date + '</div><div class="hbadge">' + esc(log.type) + '</div></div>';
      html += '<div style="flex:1;min-width:0"><div class="ha">' + esc(log.accountName) + '</div><div class="hn">' + esc(log.notes) + '</div></div>';
      html += '</div>';
    });
  }

  el.innerHTML = html;
}

function esc(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function setActiveTier(t) { activeTier = t; renderDashboard(); updateStats(); }
function setSearch(v) { search = v; renderDashboard(); }
function toggleExpand(id) { expanded = (expanded === id) ? null : id; renderDashboard(); }

function assignTier(id, val) {
  if (val) { tierMap[id] = val; } else { delete tierMap[id]; }
  save();
  updateStats();
  if (currentView === "setup") renderSetup();
}

function openLog(id) {
  logModal = id;
  const acct = ACCOUNTS.find(a => a.id === id);
  document.getElementById("modal-acct-name").textContent = acct ? acct.name : "";
  document.getElementById("log-date").value = today();
  document.getElementById("log-notes").value = "";
  document.getElementById("log-type").value = "Meeting";
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  logModal = null;
  document.getElementById("modal").style.display = "none";
}

function saveLog() {
  const notes = document.getElementById("log-notes").value.trim();
  if (!logModal || !notes) return;
  const acct = ACCOUNTS.find(a => a.id === logModal);
  logs.unshift({
    id: Date.now().toString(),
    accountId: logModal,
    accountName: acct ? acct.name : "",
    date: document.getElementById("log-date").value,
    type: document.getElementById("log-type").value,
    notes: notes
  });
  save();
  closeModal();
  updateStats();
  if (currentView === "dashboard") renderDashboard();
  else if (currentView === "queue") renderQueue();
  else if (currentView === "history") renderHistory();
}

// INIT
document.getElementById("log-date").value = today();
renderDashboard();
updateStats();
